version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package_prefix
      module: buf.build/cludden/protoc-gen-go-temporal
  override:
    - file_option: go_package_prefix
      value: github.com/taltemus/stacked-diff-example/gen
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go_temporal
    out: gen
    strategy: all
    opt:
      - cli-categories=true
      - cli-enabled=true
      - docs-out=./proto/README.md
      - enable-xns=true
      - paths=source_relative
      - workflow-update-enabled=true
